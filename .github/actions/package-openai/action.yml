name: Package OpenAI submission
description: Build the OpenAI plugin ZIP and save it as a downloadable CI artifact.

runs:
  using: composite
  steps:
    - name: Build
      shell: bash
      run: bun run build:openai

    - name: Upload
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: vercel-openai
        path: dist/openai/vercel-*.zip
        if-no-files-found: error
